        #   maxDistances: []
        #   downSizes: []

      arm:
        jointState:
          names: ['masterLeft', 'masterRight', 'puppetLeft', 'puppetRight']
          topics: ['/left_arm/control/joint_states','/right_arm/control/joint_states','/left_arm/feedback/joint_states', '/right_arm/feedback/joint_states']
        endPose:
          names: ['masterLeft', 'masterRight', 'puppetLeft', 'puppetRight']
          topics: ['/left_arm/ik_fk_pose','/right_arm/ik_fk_pose','/left_arm/feedback/tcp_pose', '/right_arm/feedback/tcp_pose']
          orients: [true, true, true, true]

      localization:
        pose:
          names: ['pika_l', 'pika_r']
          topics: ['/pika_pose_l', '/pika_pose_r']

      gripper:
        encoder:
          names: ['pikaSensor_l', 'pikaSensor_r', 'pikaGripper_l', 'pikaGripper_r']
          topics: ['/sensor/gripper_l/data', '/sensor/gripper_r/data', '/gripper/gripper_l/data', '/gripper/gripper_r/data']

